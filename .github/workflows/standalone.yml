name: Standalone build
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md", "LICENSE.md"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test build environment discovery
        run: |
          python3 scripts/test-android-build-env.py
          python3 scripts/test-inventory-repositories.py
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - name: Fetch only declared source dependencies
        run: |
          python3 scripts/fetch-dependencies.py
          python3 scripts/fetch-dependencies.py --check
      # storage-engine's 91 filesystem/JNI integration cases run on Termux.
      # A Linux host-JVM JNI harness is deferred; do not misreport them as passed here.
      - name: Build Android APK and run app and hex unit tests
        run: ./build.sh --max-workers=2 --console=plain
